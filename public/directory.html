<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Austin reports. Cited</title>
  <meta name="description" content="Live AI visibility reports for Austin dental practices. Perplexity scan, no invented names.">
  <meta name="theme-color" content="#F1EBE1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .dir-lead { color: var(--muted); max-width: 34rem; }
    .dir-list { list-style: none; padding: 0; margin: 1.75rem 0 0; }
    .dir-list li { border-top: 1px solid var(--line); }
    .dir-list a {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 0;
      color: inherit;
      text-decoration: none;
    }
    .dir-list a:hover .dir-name { color: var(--accent); }
    .dir-name { font-family: var(--serif); font-size: 1.15rem; font-weight: 500; }
    .dir-flag { font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .dir-flag.yes { color: var(--ok); }
    .dir-flag.no { color: var(--no); }
    .dir-note { margin-top: 2rem; color: var(--muted); font-size: 0.92rem; }
  </style>
</head>
<body>
  <div class="frame">
    <header class="site-header">
      <a class="wordmark" href="/">Cited<sup>1</sup></a>
      <p class="header-meta">Austin dentists</p>
    </header>
    <main>
      <p class="eyebrow">Live scans</p>
      <h1>Practices we have already run</h1>
      <p class="dir-lead">These reports are from a real Perplexity pass. ChatGPT was behind a login, so it is not in these numbers. Click a name to open the report.</p>
      <ol class="dir-list" id="dir-list">
        <li>Loading the live list.</li>
      </ol>
      <p class="dir-note" id="dir-note"></p>
    </main>
    <footer class="site-footer">
      <p>Cited. Austin dentists.</p>
    </footer>
  </div>
  <script src="/js/directory.js"></script>
</body>
</html>
